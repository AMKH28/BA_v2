---
- name: Helm auf dem Server-Node installieren                          # Nötig, weil alle Longhorn-Tasks per delegate_to AUF rke2-server-01 laufen, nicht auf der control-node
  shell: curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm                                        # Idempotenz: überspringt die Installation, falls Helm schon da ist
  delegate_to: rke2-server-01
  become: yes

- name: Longhorn Helm-Repository hinzufügen                              # Registriert die offizielle Longhorn-Chart-Quelle bei Helm
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
  delegate_to: rke2-server-01                                            # Helm braucht Zugriff auf die Kubernetes-API, die nur vom Server-Node aus per kubeconfig erreichbar ist
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml

- name: Longhorn installieren                                            # Installiert den kompletten Longhorn-Stack (Manager, Driver, UI) per Helm-Chart
  kubernetes.core.helm:
    name: longhorn                                                        # Name der Helm-Release (frei wählbar, taucht in "helm list" auf)
    chart_ref: longhorn/longhorn                                          # Verweist auf das Repo+Chart von oben
    release_namespace: longhorn-system                                    # Longhorn läuft konventionell in einem eigenen Namespace, nicht in kube-system
    create_namespace: true                                                # Legt den Namespace automatisch an, falls er noch nicht existiert
    values:
      defaultSettings:
        createDefaultDiskLabeledNodes: true                               # Longhorn erstellt Storage-Disks NUR auf Nodes, die explizit das passende Label tragen
      longhornManager:
        nodeSelector:
          node-role.kubernetes.io/storage: "true"                         # Manager-Pod läuft nur auf dem Storage-Node
        tolerations:                                                      # Erlaubt diesem Pod, trotz unseres Taints auf dem Storage-Node zu landen
          - key: node-role.kubernetes.io/storage                          # Muss exakt zum Taint-Key passen
            operator: Equal                                              # "Equal", da wir einen konkreten Wert prüfen wollen, nicht nur Existenz des Keys
            value: "true"
            effect: NoSchedule                                            # Muss zum Taint-Effect passen
      longhornDriver:
        nodeSelector:
          node-role.kubernetes.io/storage: "true"
        tolerations:                                                      # Gleiche Toleration für den Driver-Deployer — genau der Pod, der vorhin Pending hing
          - key: node-role.kubernetes.io/storage
            operator: Equal
            value: "true"
            effect: NoSchedule
      persistence:
        defaultClassReplicaCount: 1                                       # Nur 1 Replika statt Standard 3. weil nur einen Storage-Nodegebraucht wird, mehr Replikate würden ohnehin auf demselben Node landen
  delegate_to: rke2-server-01
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
