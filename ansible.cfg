[defaults]
# Pfad zum Inventory
inventory = ansible/inventory/hosts.ini

# NEU: sagt Ansible, dass Rollen unter ansible/roles liegen, nicht im Standard-Ort "roles/" neben site.yml
roles_path = ansible/roles

# Unterdrückt Host-Key-Abfragen bei neuen VMs
host_key_checking = False

# SSH-Key der control-node
private_key_file = ~/.ssh/id_ed25519
